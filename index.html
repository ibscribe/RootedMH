<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 56px;
            color: #000;
            margin-bottom: 32px;
            font-weight: 400;
            letter-spacing: -1px;
        }

        a {
            font-size: 18px;
            color: #0066cc;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 42px;
                margin-bottom: 24px;
            }

            a {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Coming Soon</h1>
        <a href="https://simplepractice.com">simplepractice.com</a>
